<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rental Management Portal</title>
  <style>
    :root {
      --bg: #eef4ff;
      --panel: #ffffff;
      --panel-soft: #f7f9ff;
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dfe7ff;
      --shadow: 0 12px 28px rgba(37, 99, 235, 0.12);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #e0ecff 0%, #f3f6ff 50%, #eef2ff 100%);
      color: var(--text);
    }

    button, input, select {
      font: inherit;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 28px;
    }
    .screen.active { display: block; }

    .login-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .login-card {
      width: min(100%, 420px);
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(148,163,184,0.28);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 32px 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--primary);
      font-weight: 700;
    }

    h1, h2, h3, h4, p { margin-top: 0; }
    .login-card h1 {
      font-size: clamp(2rem, 3vw, 2.5rem);
      margin-bottom: 8px;
    }

    .subtle {
      color: var(--muted);
      margin-bottom: 26px;
      line-height: 1.5;
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text);
    }
    .field input, .field select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }
    .field input:focus, .field select:focus {
      outline: 2px solid rgba(59,130,246,0.25);
      border-color: var(--primary);
    }

    .primary-btn, .secondary-btn, .ghost-btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }
    .primary-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 12px 18px rgba(59,130,246,0.18);
      width: 100%;
    }
    .secondary-btn {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: white;
    }
    .ghost-btn {
      background: #eef4ff;
      color: var(--primary-dark);
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.7; cursor: wait; }

    .alert {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 18px;
      font-size: 14px;
      font-weight: 600;
    }
    .alert.show { display: block; }
    .alert.error {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .alert.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .topbar {
      max-width: 1200px;
      margin: 0 auto 20px;
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 18px;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text);
    }

    .user-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .role-pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .dashboard {
      max-width: 1200px;
      margin: 0 auto;
      padding-bottom: 36px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 18px;
      margin: 24px 0;
    }

    .stat-card {
      background: var(--panel);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .stat-value {
      font-size: clamp(1.7rem, 2vw, 2.3rem);
      font-weight: 800;
      line-height: 1;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .list-grid, .card-grid {
      display: grid;
      gap: 14px;
    }
    .card-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .house-card, .tenant-card, .device-card, .profile-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel-soft);
      padding: 16px;
    }

    .house-card h3, .tenant-card h3, .device-card h3 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .tag {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .inline-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .mini-btn {
      border: none;
      background: #e0ecff;
      color: var(--primary-dark);
      border-radius: 10px;
      padding: 8px 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .mini-btn.danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .profile-card {
      display: grid;
      gap: 10px;
    }
    .profile-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(148,163,184,0.25);
    }
    .profile-line:last-child { border-bottom: none; }
    .label { color: var(--muted); }

    .device-status {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .device-status.online {
      background: #dcfce7;
      color: #166534;
    }
    .device-status.offline {
      background: #fee2e2;
      color: #991b1b;
    }

    .password-form {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .view-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0 18px;
    }

    .view-tab {
      border: 1px solid var(--border);
      background: #f8faff;
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border-color: transparent;
      box-shadow: 0 10px 18px rgba(59,130,246,0.18);
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 22px;
      color: var(--muted);
      text-align: center;
      background: rgba(255,255,255,0.4);
    }
    .house-selector {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--muted);
      font-weight: 700;
    }
    .house-selector select {
      min-width: min(100%, 260px);
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      color: var(--text);
      font: inherit;
    }
    .device-edit-form {
      display: grid;
      gap: 10px;
      margin: 14px 0;
    }
    .device-edit-form input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }
    .pairing-key-panel {
      margin: 14px 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #eff6ff;
    }
    .pairing-key-panel code {
      display: block;
      margin: 10px 0;
      padding: 10px;
      overflow-wrap: anywhere;
      background: white;
      border-radius: 8px;
    }

    .house-selector {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--muted);
      font-weight: 700;
    }
    .house-selector select {
      min-width: min(100%, 260px);
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      color: var(--text);
      font: inherit;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .dashboard { padding: 0 10px 24px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .view-tabs { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <div id="loginScreen" class="screen active">
    <div class="login-shell">
      <div class="login-card">
        <p class="eyebrow">Rental Management</p>
        <h1>Smart Home Access</h1>
        <p class="subtle">Secure portal for owners, admins, tenants and users.</p>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" value="admin@example.com" autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" value="AdminPass123!" autocomplete="current-password" />
        </div>

        <button id="loginBtn" class="primary-btn" type="button">Sign In</button>
        <div id="loginAlert" class="alert error"></div>
      </div>
    </div>
  </div>

  <div id="dashboardScreen" class="screen">
    <header class="topbar">
      <div class="brand">Rental Management Portal</div>
      <div class="user-meta">
        <span id="userRole" class="role-pill">Role</span>
        <strong id="userDisplayName">User</strong>
        <button id="logoutBtn" class="ghost-btn" type="button">Logout</button>
      </div>
    </header>

    <div class="dashboard">
      <div id="statsGrid" class="stat-grid"></div>

      <div id="viewTabs" class="view-tabs" aria-label="Main navigation"></div>

      <div class="layout">
        <section class="panel">
          <div class="panel-header">
            <h2 id="mainPanelTitle">Overview</h2>
            <button id="refreshBtn" class="secondary-btn" type="button">Refresh</button>
          </div>
          <div id="mainPanelContent" class="list-grid"></div>
        </section>

        <aside class="panel">
          <div class="panel-header">
            <h2>Profile</h2>
          </div>
          <div id="profilePanel" class="profile-card"></div>

          <div class="panel-header" style="margin-top:24px;">
            <h2>Change password</h2>
          </div>
          <form id="passwordForm" class="password-form">
            <input id="oldPassword" type="password" placeholder="Current password" />
            <input id="newPassword" type="password" placeholder="New password" />
            <button type="submit" class="primary-btn" style="width:100%;">Update Password</button>
          </form>
          <div id="passwordAlert" class="alert"></div>
        </aside>
      </div>
    </div>
  </div>

  <script>
    function resolveApiBase() {
      const host = window.location.hostname;
      const origin = window.location.origin;

      if (host === 'localhost' || host === '127.0.0.1' || host === '[::1]' || origin.includes('8787')) {
        return origin || 'http://127.0.0.1:8787';
      }

      if (host === 'rental-management.ehexibit.com') {
        return 'https://api.ehexibit.com';
      }

      return origin || 'http://127.0.0.1:8787';
    }

    const API_BASE = resolveApiBase();
    const WS_BASE = API_BASE.replace(/^http/, 'ws');

    const state = {
      jwt: '',
      profile: null,
      role: null,
      houses: [],
      tenants: [],
      selectedHouseId: null,
      devices: [],
      fingerprints: {},
      ws: null,
      activeView: 'overview'
    };

    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const loginAlert = document.getElementById('loginAlert');
    const passwordAlert = document.getElementById('passwordAlert');
    const mainPanelContent = document.getElementById('mainPanelContent');
    const profilePanel = document.getElementById('profilePanel');
    const statsGrid = document.getElementById('statsGrid');
    const userDisplayName = document.getElementById('userDisplayName');
    const userRole = document.getElementById('userRole');
    const mainPanelTitle = document.getElementById('mainPanelTitle');
    const viewTabs = document.getElementById('viewTabs');

    function showAlert(element, message, type) {
      element.textContent = message;
      element.className = `alert ${type} show`;
    }

    function clearAlert(element) {
      element.textContent = '';
      element.className = 'alert';
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    function formatRole(role) {
      return role ? role.toUpperCase() : 'USER';
    }

    function getRoleViews() {
      if (state.role === 'admin' || state.role === 'owner') {
        return ['overview', 'houses', 'tenants', 'devices'];
      }
      return ['overview', 'houses', 'devices'];
    }

    function renderViewTabs() {
      const views = getRoleViews();
      const labels = {
        overview: 'Overview',
        houses: 'Houses',
        tenants: 'Tenants',
        devices: 'Devices'
      };

      viewTabs.innerHTML = views.map(view => `
        <button
          type="button"
          class="view-tab ${state.activeView === view ? 'active' : ''}"
          data-view="${view}"
        >${labels[view]}</button>
      `).join('');

      viewTabs.querySelectorAll('[data-view]').forEach(button => {
        button.addEventListener('click', () => {
          state.activeView = button.dataset.view;
          renderViewTabs();
          renderMainPanel();
        });
      });
    }

    function setActiveScreen(screen) {
      loginScreen.classList.toggle('active', screen === 'login');
      dashboardScreen.classList.toggle('active', screen === 'dashboard');
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });

      const text = await response.text();
      const data = text ? JSON.parse(text) : {};

      if (!response.ok) {
        throw new Error(data.error || data.message || 'Request failed');
      }

      return data;
    }

        function getAuthHeaders() {
      return {
        Authorization: `Bearer ${state.jwt}`,
        'Content-Type': 'application/json'
      };
    }

    function renderStats() {
      const role = state.role;
      let cards = [
        { label: 'Houses', value: state.houses.length },
        { label: 'Tenants', value: state.tenants.length },
        { label: 'Assigned Devices', value: state.devices.length }
      ];

      if (role === 'tenant' || role === 'user') {
        cards = [
          { label: 'Assigned House', value: state.houses.length || 0 },
          { label: 'Devices', value: state.devices.length },
          { label: 'Role', value: formatRole(role).slice(0, 6) }
        ];
      }

      statsGrid.innerHTML = cards.map(card => `
        <div class="stat-card">
          <div class="stat-label">${card.label}</div>
          <div class="stat-value">${card.value}</div>
        </div>
      `).join('');
    }

    function renderProfile() {
      const profile = state.profile || {};
      const assignedHouse = profile.assigned_house || profile.assignedHouse || (['tenant', 'user'].includes(state.role) ? state.houses[0] : null) || null;

      const values = [
        ['Name', profile.name || 'Not provided'],
        ['Email', profile.email || 'Not provided'],
        ['Role', formatRole(state.role)],
        ['House', assignedHouse ? assignedHouse.name : 'No assigned house'],
        ['Location', assignedHouse ? (assignedHouse.location || 'N/A') : 'N/A']
      ];

      profilePanel.innerHTML = values.map(([label, value]) => `
        <div class="profile-line">
          <span class="label">${label}</span>
          <strong>${value}</strong>
        </div>
      `).join('');
    }

    function renderHouseList() {
      if (!state.houses.length) {
        mainPanelContent.innerHTML = '<div class="empty">No houses available for this account.</div>';
        return;
      }

      const cards = state.houses.map(house => `
        <div class="house-card">
          <div class="tag">House</div>
          <h3>${house.name || 'Unnamed House'}</h3>
          <div class="meta">${house.location || 'No location'}<br />Owner ID: ${house.owner_id || 'N/A'}</div>
          <div class="inline-actions">
            <button class="mini-btn" data-house-id="${house.id}" data-action="select-house">View Devices</button>
          </div>
        </div>
      `).join('');

      mainPanelContent.innerHTML = `<div class="card-grid">${cards}</div>`;

      document.querySelectorAll('[data-action="select-house"]').forEach(button => {
        button.addEventListener('click', () => {
          const houseId = Number(button.dataset.houseId);
          state.selectedHouseId = houseId;
          state.activeView = 'devices';
          renderViewTabs();
          renderMainPanel();
        });
      });
    }

    function renderTenantList() {
      if (!state.tenants.length) {
        mainPanelContent.innerHTML = '<div class="empty">No tenants assigned to this account scope.</div>';
        return;
      }

      const html = state.tenants.map(tenant => `
        <div class="tenant-card">
          <h3>${tenant.name || tenant.email || 'Tenant'}</h3>
          <div class="meta">${tenant.email || 'No email'}<br />Unit: ${tenant.leased_unit || 'N/A'}<br />Rent: ${tenant.rent_amount || 'N/A'}</div>
          <div class="tag">Tenant</div>
        </div>
      `).join('');

      mainPanelContent.innerHTML = `<div class="card-grid">${html}</div>`;
    }

    function renderDeviceList() {
      if (!state.houses.length) {
        mainPanelContent.innerHTML = '<div class="empty">No house is assigned to this account, so there are no house devices to show.</div>';
        return;
      }

      const selectedHouse = state.houses.find(house => Number(house.id) === Number(state.selectedHouseId)) || state.houses[0];
      state.selectedHouseId = Number(selectedHouse.id);
      const selectedHouseId = selectedHouse.id;
      const canManageDevices = state.role === 'admin' || state.role === 'owner';
      const visibleDevices = state.devices.filter(device => {
        return Number(device.house_id) === Number(selectedHouseId);
      });

      const cards = visibleDevices.map(device => `
        ${(() => {
          const enrollments = state.fingerprints[device.id] || [];
          const mine = enrollments.find(item => Number(item.user_id) === Number(state.profile?.id));
          const fingerprintRows = enrollments.map(item => `
            <div class="inline-actions">
              <span class="meta">Slot ${item.fingerprint_id}: ${escapeHtml(item.name || item.email || `User ${item.user_id}`)}: ${escapeHtml(item.status)}${item.enrollment_pending ? ' (enrollment in progress)' : ''}</span>
              ${canManageDevices && item.status !== 'disabled' ? `
                <button class="mini-btn" type="button" data-fingerprint-action="disable" data-device-id="${device.id}" data-fingerprint-id="${item.fingerprint_id}">Disable</button>
                <button class="mini-btn" type="button" data-fingerprint-action="delete" data-device-id="${device.id}" data-fingerprint-id="${item.fingerprint_id}">Delete</button>
              ` : ''}
            </div>
          `).join('');
          return `
        <div class="device-card">
          <h3>${escapeHtml(device.device_name || `Device ${device.id}`)}</h3>
          <div class="meta">Type: ${escapeHtml(device.device_type || 'Unknown')}<br />House: ${escapeHtml(selectedHouse.name || `House ${selectedHouse.id}`)}</div>
          <span class="device-status ${['online', 'active', 'on'].includes(String(device.status || '').toLowerCase()) ? 'online' : 'offline'}">
            ${escapeHtml(device.status || 'offline')}
          </span>
          <div class="inline-actions">
            <button class="mini-btn" type="button" data-device-command="door.unlock" data-device-id="${device.id}">Unlock door (5 sec)</button>
            <button class="mini-btn" type="button" data-device-command="door.lock" data-device-id="${device.id}">Lock door</button>
            <button class="mini-btn" type="button" data-device-command="io.set" data-control-id="relay2" data-control-state="true" data-device-id="${device.id}">Relay 2 on</button>
            <button class="mini-btn" type="button" data-device-command="io.set" data-control-id="relay2" data-control-state="false" data-device-id="${device.id}">Relay 2 off</button>
          </div>
          <div class="device-edit-form">
            <strong>Fingerprint access</strong>
            <p class="meta">${mine ? `Your fingerprint: slot ${mine.fingerprint_id} (${escapeHtml(mine.status)}${mine.enrollment_pending ? ', enrollment in progress' : ''})` : 'No fingerprint is registered for your account on this device.'}</p>
            <div class="inline-actions">
              <button class="mini-btn" type="button" data-fingerprint-enroll data-device-id="${device.id}">${mine?.status === 'active' ? 'Re-enroll my fingerprint' : 'Register my fingerprint'}</button>
            </div>
            ${canManageDevices ? fingerprintRows : ''}
            <div class="meta" data-fingerprint-status="${device.id}" aria-live="polite"></div>
          </div>
          ${canManageDevices ? `
            <form class="device-edit-form" data-device-id="${device.id}">
              <input name="name" aria-label="Device name" value="${escapeHtml(device.device_name || '')}" required />
              <input name="type" aria-label="Device type" value="${escapeHtml(device.device_type || '')}" required />
              <div class="inline-actions">
                <button class="mini-btn" type="submit">Save</button>
                <button class="mini-btn" type="button" data-delete-device="${device.id}">Delete</button>
              </div>
            </form>
            <div class="inline-actions">
              <span class="tag">${device.pairing_configured ? 'ESP32 paired' : 'ESP32 not paired'}</span>
              <button class="mini-btn" type="button" data-pair-device="${device.id}">${device.pairing_configured ? 'Regenerate pairing key' : 'Pair ESP32'}</button>
            </div>
          ` : ''}
        </div>
          `;
        })()}
      `).join('');

      const houseOptions = state.houses.map(house => `
        <option value="${house.id}" ${Number(house.id) === Number(selectedHouseId) ? 'selected' : ''}>
          ${escapeHtml(house.name || `House ${house.id}`)}
        </option>
      `).join('');
      const deviceContent = visibleDevices.length
        ? `<div class="card-grid">${cards}</div>`
        : '<div class="empty">No devices are associated with this house yet.</div>';
      const addDeviceForm = canManageDevices ? `
        <form id="addDeviceForm" class="device-edit-form">
          <strong>Add a device to ${escapeHtml(selectedHouse.name || `House ${selectedHouse.id}`)}</strong>
          <input name="name" aria-label="New device name" placeholder="Device name" required />
          <input name="type" aria-label="New device type" placeholder="Device type (e.g. Switch)" required />
          <button class="primary-btn" type="submit">Add device</button>
        </form>
      ` : '';

      mainPanelContent.innerHTML = `
        <label class="house-selector" for="deviceHouseSelect">
          Devices for house
          <select id="deviceHouseSelect">${houseOptions}</select>
        </label>
        <div id="deviceNotice" class="alert"></div>
        ${addDeviceForm}
        ${deviceContent}
      `;
      document.getElementById('deviceHouseSelect').addEventListener('change', event => {
        state.selectedHouseId = Number(event.target.value);
        renderMainPanel();
      });

      const deviceNotice = document.getElementById('deviceNotice');
      function showPairingKey(deviceId, pairingKey) {
        const notice = document.getElementById('deviceNotice');
        if (!notice) return;
        const panel = document.createElement('div');
        panel.className = 'pairing-key-panel';
        const apiUrl = new URL(API_BASE);
        const heading = document.createElement('strong');
        heading.textContent = 'One-time ESP32 pairing key';
        const instructions = document.createElement('p');
        instructions.textContent = `Save this key now. In the ESP32 setup portal configure API host ${apiUrl.hostname}, port ${apiUrl.port || (apiUrl.protocol === 'https:' ? '443' : '80')}, secure ${apiUrl.protocol === 'https:' ? 'true' : 'false'}, device ID ${deviceId}, enable authentication, and paste the key as the device credential. The key will not be shown again.`;
        const key = document.createElement('code');
        key.textContent = pairingKey;
        const copy = document.createElement('button');
        copy.className = 'mini-btn';
        copy.type = 'button';
        copy.textContent = 'Copy pairing key';
        copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(pairingKey);
            copy.textContent = 'Copied';
          } catch {
            copy.textContent = 'Select and copy the key above';
          }
        });
        panel.append(heading, instructions, key, copy);
        notice.replaceChildren(panel);
        notice.className = 'alert success show';
      }
      const refreshDevices = async () => {
        state.devices = [];
        await loadDashboardData();
        state.activeView = 'devices';
        renderMainPanel();
      };

      async function openDeviceSocket(deviceId) {
        const ticketData = await requestJson(`${API_BASE}/ws/ticket`, {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({
            houseId: Number(selectedHouseId),
            deviceId: Number(deviceId),
            clientType: 'web'
          })
        });
        const socket = new WebSocket(`${WS_BASE}/ws/house/${selectedHouseId}?ticket=${encodeURIComponent(ticketData.ticket)}`);
        await new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => {
            socket.close();
            reject(new Error('Could not connect to the device control channel.'));
          }, 10000);
          socket.addEventListener('open', () => {
            window.clearTimeout(timeout);
            resolve();
          }, { once: true });
          socket.addEventListener('error', () => {
            window.clearTimeout(timeout);
            reject(new Error('Could not connect to the device control channel.'));
          }, { once: true });
        });
        return socket;
      }

      function sendPersistentDeviceCommand(socket, deviceId, command, fields = {}) {
        socket.send(JSON.stringify({
          type: 'device_command',
          targetDeviceId: Number(deviceId),
          command,
          ...fields
        }));
      }

      function waitForDeviceResponse(socket, deviceId, command) {
        return new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => finish(new Error('The device did not respond to the fingerprint sensor check.')), 10000);
          const finish = error => {
            window.clearTimeout(timeout);
            socket.removeEventListener('message', onMessage);
            socket.removeEventListener('close', onClose);
            if (error) reject(error);
          };
          const onClose = () => finish(new Error('Device disconnected before responding.'));
          const onMessage = event => {
            let message;
            try { message = JSON.parse(event.data); } catch { return; }
            if (message.type === 'device_response' && Number(message.deviceId) === Number(deviceId) && message.command === command) {
              finish();
              if (message.success === false) reject(new Error(message.message || 'Fingerprint sensor is not available.'));
              else resolve(message);
            } else if (message.type === 'error') {
              finish(new Error(message.error || 'Fingerprint sensor check failed.'));
            }
          };
          socket.addEventListener('message', onMessage);
          socket.addEventListener('close', onClose, { once: true });
          sendPersistentDeviceCommand(socket, deviceId, command);
        });
      }

      document.querySelectorAll('[data-fingerprint-enroll]').forEach(button => {
        button.addEventListener('click', async () => {
          const deviceId = Number(button.dataset.deviceId);
          const current = (state.fingerprints[deviceId] || []).find(item => Number(item.user_id) === Number(state.profile?.id));
          if (current?.status === 'active' && !window.confirm('Re-enroll and replace your current fingerprint on this device?')) return;
          button.disabled = true;
          let socket;
          let enrollmentReserved = false;
          const status = document.querySelector(`[data-fingerprint-status="${deviceId}"]`);
          try {
            socket = await openDeviceSocket(deviceId);
            const sensorStatus = await waitForDeviceResponse(socket, deviceId, 'fingerprint.status');
            if (!/sensor connected/i.test(sensorStatus.message || '')) {
              throw new Error('Fingerprint sensor is not connected to the device.');
            }
            const reservation = await requestJson(`${API_BASE}/api/devices/${deviceId}/fingerprints/enroll`, {
              method: 'POST',
              headers: getAuthHeaders(),
              body: JSON.stringify({})
            });
            enrollmentReserved = true;

            const outcome = await new Promise((resolve, reject) => {
              const timeout = window.setTimeout(() => finish(new Error('Fingerprint enrollment timed out. You can try again.')), 70000);
              const finish = error => {
                window.clearTimeout(timeout);
                socket.removeEventListener('message', onMessage);
                socket.removeEventListener('close', onClose);
                if (error) reject(error);
              };
              const onMessage = event => {
                let message;
                try { message = JSON.parse(event.data); } catch { return; }
                if (message.type === 'device_response' && Number(message.deviceId) === deviceId && message.command === 'fingerprint.register') {
                  if (message.success === false) {
                    finish(new Error(message.message || 'The device rejected fingerprint enrollment.'));
                  } else {
                    if (status) status.textContent = `Place your finger on the sensor for slot ${reservation.fingerprintId}. Follow the sensor prompts.`;
                  }
                } else if (message.type === 'fingerprint.event' && Number(message.deviceId) === deviceId &&
                           Number(message.id) === Number(reservation.fingerprintId) &&
                           ['enrollment_place_finger', 'enrollment_remove_finger', 'enrollment_place_same_finger'].includes(message.event)) {
                  if (status) status.textContent = message.message || 'Follow the fingerprint sensor prompt.';
                } else if (message.type === 'fingerprint.event' && Number(message.deviceId) === deviceId &&
                           Number(message.id) === Number(reservation.fingerprintId) &&
                           ['enrollment_complete', 'enrollment_failed'].includes(message.event)) {
                  finish();
                  resolve({ success: message.event === 'enrollment_complete' && message.success === true, message: message.message });
                } else if (message.type === 'error') {
                  finish(new Error(message.error || 'Fingerprint enrollment failed.'));
                }
              };
              const onClose = () => finish(new Error('Device disconnected before enrollment completed.'));
              socket.addEventListener('message', onMessage);
              socket.addEventListener('close', onClose, { once: true });
              sendPersistentDeviceCommand(socket, deviceId, 'fingerprint.register', { id: reservation.fingerprintId });
            });

            if (!outcome.success) throw new Error(outcome.message || 'Fingerprint enrollment failed.');
            enrollmentReserved = false;
            await refreshDevices();
            const updatedStatus = document.querySelector(`[data-fingerprint-status="${deviceId}"]`);
            if (updatedStatus) updatedStatus.textContent = 'Fingerprint registered successfully.';
          } catch (error) {
            if (enrollmentReserved) {
              try {
                await requestJson(`${API_BASE}/api/devices/${deviceId}/fingerprints/enroll`, {
                  method: 'DELETE',
                  headers: getAuthHeaders()
                });
              } catch (cancelError) {
                console.error('Could not cancel reserved fingerprint enrollment:', cancelError);
              }
            }
            if (status) status.textContent = error.message || 'Fingerprint enrollment failed.';
          } finally {
            if (socket && socket.readyState < WebSocket.CLOSING) socket.close();
            button.disabled = false;
          }
        });
      });

      document.querySelectorAll('[data-fingerprint-action]').forEach(button => {
        button.addEventListener('click', async () => {
          const action = button.dataset.fingerprintAction;
          const deviceId = Number(button.dataset.deviceId);
          const fingerprintId = Number(button.dataset.fingerprintId);
          if (!window.confirm(`${action === 'disable' ? 'Disable' : 'Delete'} this fingerprint? The template will be removed from the sensor.`)) return;
          button.disabled = true;
          let socket;
          try {
            socket = await openDeviceSocket(deviceId);
            sendPersistentDeviceCommand(socket, deviceId, 'fingerprint.delete', { id: fingerprintId });
            await new Promise((resolve, reject) => {
              const timeout = window.setTimeout(() => reject(new Error('The device did not confirm fingerprint removal.')), 10000);
              socket.addEventListener('message', event => {
                let message;
                try { message = JSON.parse(event.data); } catch { return; }
                if (message.type === 'device_response' && Number(message.deviceId) === deviceId && message.command === 'fingerprint.delete') {
                  window.clearTimeout(timeout);
                  if (message.success === false) reject(new Error(message.message || 'The device rejected fingerprint removal.'));
                  else resolve();
                } else if (message.type === 'error') {
                  window.clearTimeout(timeout);
                  reject(new Error(message.error || 'Fingerprint removal failed.'));
                }
              });
            });
            await requestJson(`${API_BASE}/api/devices/${deviceId}/fingerprints/${fingerprintId}`, {
              method: 'DELETE',
              headers: getAuthHeaders(),
              body: JSON.stringify({ action })
            });
            await refreshDevices();
          } catch (error) {
            showAlert(document.getElementById('deviceNotice') || deviceNotice, error.message || 'Unable to remove fingerprint.', 'error');
          } finally {
            if (socket && socket.readyState < WebSocket.CLOSING) socket.close();
            button.disabled = false;
          }
        });
      });

      document.getElementById('addDeviceForm')?.addEventListener('submit', async event => {
        event.preventDefault();
        const formData = new FormData(event.currentTarget);
        try {
          const result = await requestJson(`${API_BASE}/api/houses/${selectedHouseId}/devices`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify({ name: formData.get('name'), type: formData.get('type') })
          });
          await refreshDevices();
          showPairingKey(result.device.id, result.pairing_key);
        } catch (error) {
          showAlert(document.getElementById('deviceNotice') || deviceNotice, error.message || 'Unable to add device.', 'error');
        }
      });

      document.querySelectorAll('.device-edit-form[data-device-id]').forEach(form => {
        form.addEventListener('submit', async event => {
          event.preventDefault();
          const formData = new FormData(event.currentTarget);
          try {
            await requestJson(`${API_BASE}/api/devices/${form.dataset.deviceId}`, {
              method: 'PUT',
              headers: getAuthHeaders(),
              body: JSON.stringify({ name: formData.get('name'), type: formData.get('type') })
            });
            await refreshDevices();
          } catch (error) {
            showAlert(document.getElementById('deviceNotice') || deviceNotice, error.message || 'Unable to update device.', 'error');
          }
        });
      });

      document.querySelectorAll('[data-delete-device]').forEach(button => {
        button.addEventListener('click', async () => {
          if (!window.confirm('Delete this device?')) return;
          try {
            await requestJson(`${API_BASE}/api/devices/${button.dataset.deleteDevice}`, {
              method: 'DELETE',
              headers: getAuthHeaders()
            });
            await refreshDevices();
          } catch (error) {
            showAlert(document.getElementById('deviceNotice') || deviceNotice, error.message || 'Unable to delete device.', 'error');
          }
        });
      });

      document.querySelectorAll('[data-pair-device]').forEach(button => {
        button.addEventListener('click', async () => {
          if (!window.confirm('Generate a new pairing key? The current key will stop working.')) return;
          try {
            const result = await requestJson(`${API_BASE}/api/devices/${button.dataset.pairDevice}/pairing-key`, {
              method: 'POST',
              headers: getAuthHeaders()
            });
            await refreshDevices();
            showPairingKey(button.dataset.pairDevice, result.pairing_key);
          } catch (error) {
            showAlert(document.getElementById('deviceNotice') || deviceNotice, error.message || 'Unable to pair device.', 'error');
          }
        });
      });

      document.querySelectorAll('[data-device-command]').forEach(button => {
        button.addEventListener('click', async () => {
          button.disabled = true;
          try {
            const ticketData = await requestJson(`${API_BASE}/ws/ticket`, {
              method: 'POST',
              headers: getAuthHeaders(),
              body: JSON.stringify({
                houseId: Number(selectedHouseId),
                deviceId: Number(button.dataset.deviceId),
                clientType: 'web'
              })
            });
            const socket = new WebSocket(`${WS_BASE}/ws/house/${selectedHouseId}?ticket=${encodeURIComponent(ticketData.ticket)}`);
            await new Promise((resolve, reject) => {
              let timeout = window.setTimeout(() => {
                socket.close();
                reject(new Error('Device did not acknowledge the command in time.'));
              }, 10000);
              socket.addEventListener('open', () => {
                socket.send(JSON.stringify({
                  type: 'device_command',
                  targetDeviceId: Number(button.dataset.deviceId),
                  command: button.dataset.deviceCommand,
                  id: button.dataset.controlId || '',
                  state: button.dataset.controlState === 'true',
                  params: {}
                }));
              }, { once: true });
              socket.addEventListener('message', event => {
                let message;
                try {
                  message = JSON.parse(event.data);
                } catch {
                  return;
                }
                if (message.type === 'command_routed') {
                  window.clearTimeout(timeout);
                  timeout = window.setTimeout(() => {
                    socket.close();
                    reject(new Error('The device did not confirm the command.'));
                  }, 10000);
                } else if (message.type === 'device_response' && Number(message.deviceId) === Number(button.dataset.deviceId)) {
                  window.clearTimeout(timeout);
                  socket.close();
                  if (message.success === false) reject(new Error(message.message || 'The device rejected the command.'));
                  else resolve();
                } else if (message.type === 'error') {
                  window.clearTimeout(timeout);
                  socket.close();
                  reject(new Error(message.error || 'Device command failed.'));
                }
              });
              socket.addEventListener('error', () => {
                window.clearTimeout(timeout);
                reject(new Error('Could not connect to the device control channel.'));
              }, { once: true });
            });
            showAlert(deviceNotice, 'Command sent to the device.', 'success');
          } catch (error) {
            showAlert(deviceNotice, error.message || 'Unable to control device.', 'error');
          } finally {
            button.disabled = false;
          }
        });
      });
    }

    function renderOverviewPanel() {
      const role = state.role;
      mainPanelTitle.textContent = role === 'admin' ? 'Admin Overview' : role === 'owner' ? 'Owner Overview' : 'Assigned Access';

      if (role === 'admin' || role === 'owner') {
        renderHouseList();
        if (state.tenants.length) {
          const panel = document.createElement('div');
          panel.className = 'card-grid';
          panel.innerHTML = state.tenants.map(tenant => `
            <div class="tenant-card">
              <h3>${tenant.name || tenant.email || 'Tenant'}</h3>
              <div class="meta">${tenant.email || 'No email'}<br />Unit: ${tenant.leased_unit || 'N/A'}<br />Rent: ${tenant.rent_amount || 'N/A'}</div>
              <div class="tag">Tenant</div>
            </div>
          `).join('');
          mainPanelContent.appendChild(panel);
        }
        return;
      }

      if (!state.houses.length) {
        mainPanelContent.innerHTML = '<div class="empty">No house assignment found for this account.</div>';
        return;
      }

      const cards = state.houses.map(house => `
        <div class="house-card">
          <div class="tag">House</div>
          <h3>${house.name || 'Assigned House'}</h3>
          <div class="meta">${house.location || 'No location'}<br />Owner: ${house.owner_id || 'N/A'}</div>
          <div class="inline-actions">
            <button class="mini-btn" data-house-id="${house.id}" data-action="select-house">View Devices</button>
          </div>
        </div>
      `).join('');

      mainPanelContent.innerHTML = `<div class="card-grid">${cards}</div>`;
      document.querySelectorAll('[data-action="select-house"]').forEach(button => {
        button.addEventListener('click', () => {
          const houseId = Number(button.dataset.houseId);
          state.selectedHouseId = houseId;
          state.activeView = 'devices';
          renderViewTabs();
          renderMainPanel();
        });
      });
    }

    function renderMainPanel() {
      const role = state.role;
      mainPanelContent.innerHTML = '';

      if (!state.activeView || !getRoleViews().includes(state.activeView)) {
        state.activeView = 'overview';
      }

      if (state.activeView === 'houses') {
        mainPanelTitle.textContent = role === 'admin' ? 'All Houses' : role === 'owner' ? 'My Houses' : 'Assigned Houses';
        renderHouseList();
        return;
      }

      if (state.activeView === 'tenants') {
        mainPanelTitle.textContent = 'Tenants';
        renderTenantList();
        return;
      }

      if (state.activeView === 'devices') {
        mainPanelTitle.textContent = 'Devices';
        renderDeviceList();
        return;
      }

      renderOverviewPanel();
    }

    async function loadDashboardData() {
      const headers = getAuthHeaders();
      state.devices = [];
      state.fingerprints = {};
      state.tenants = [];

      try {
        const housesResponse = await fetch(`${API_BASE}/api/houses`, { headers });
        const housesData = await housesResponse.json();
        state.houses = Array.isArray(housesData.houses) ? housesData.houses : (Array.isArray(housesData) ? housesData : []);

        if (state.role === 'admin' || state.role === 'owner') {
          const tenantsResponse = await fetch(`${API_BASE}/api/tenants`, { headers });
          const tenantsData = await tenantsResponse.json();
          state.tenants = Array.isArray(tenantsData.tenants) ? tenantsData.tenants : [];
        }

        if (state.houses.length) {
          const visibleHouseId = state.selectedHouseId || state.houses[0].id;
          state.selectedHouseId = visibleHouseId;
          for (const house of state.houses) {
            const devicesResponse = await fetch(`${API_BASE}/api/houses/${house.id}/devices`, { headers });
            const devicesData = await devicesResponse.json();
            if (!devicesResponse.ok) {
              throw new Error(devicesData.error || `Unable to load devices for house ${house.id}`);
            }
            const devices = Array.isArray(devicesData.devices) ? devicesData.devices : [];
            state.devices = [...state.devices, ...devices];
          }
          await Promise.all(state.devices.map(async device => {
            const response = await fetch(`${API_BASE}/api/devices/${device.id}/fingerprints`, { headers });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || `Unable to load fingerprints for device ${device.id}`);
            state.fingerprints[device.id] = Array.isArray(data.enrollments) ? data.enrollments : [];
          }));
        }

        renderStats();
        renderProfile();
        renderViewTabs();
        renderMainPanel();
      } catch (error) {
        console.error('Dashboard load error:', error);
        mainPanelContent.innerHTML = `<div class="empty">Unable to load dashboard data: ${error.message}</div>`;
      }
    }

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');

      if (!email || !password) {
        showAlert(loginAlert, 'Email and password are required.', 'error');
        return;
      }

      loginBtn.disabled = true;
      clearAlert(loginAlert);

      try {
        const loginResponse = await requestJson(`${API_BASE}/api/login`, {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        state.jwt = loginResponse.accessToken;
        const meResponse = await fetch(`${API_BASE}/api/me`, {
          method: 'GET',
          headers: getAuthHeaders()
        });

        const meData = meResponse.ok ? await meResponse.json() : null;
        if (!meData || !meData.user) {
          throw new Error('Could not load user profile');
        }

        state.profile = meData.user;
        state.role = String(meData.user.role || 'user').toLowerCase();
        state.activeView = 'overview';
        userDisplayName.textContent = meData.user.name || meData.user.email || 'User';
        userRole.textContent = formatRole(state.role);

        renderViewTabs();
        setActiveScreen('dashboard');
        clearAlert(passwordAlert);
        await loadDashboardData();
      } catch (error) {
        showAlert(loginAlert, error.message || 'Login failed.', 'error');
      } finally {
        loginBtn.disabled = false;
      }
    }

    async function handleLogout() {
      state.jwt = '';
      state.profile = null;
      state.role = null;
      state.houses = [];
      state.tenants = [];
      state.devices = [];
      state.fingerprints = {};
      state.selectedHouseId = null;
      state.activeView = 'overview';
      document.getElementById('email').value = 'admin@example.com';
      document.getElementById('password').value = 'AdminPass123!';
      clearAlert(loginAlert);
      clearAlert(passwordAlert);
      setActiveScreen('login');
    }

    async function handlePasswordUpdate(event) {
      event.preventDefault();
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;

      if (!oldPassword || !newPassword) {
        showAlert(passwordAlert, 'Both current and new password are required.', 'error');
        return;
      }

      try {
        const result = await requestJson(`${API_BASE}/api/update_password`, {
          method: 'POST',
          body: JSON.stringify({
            token: state.jwt,
            oldPassword,
            newPassword
          })
        });

        showAlert(passwordAlert, result.message || 'Password updated successfully.', 'success');
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
      } catch (error) {
        showAlert(passwordAlert, error.message || 'Password update failed.', 'error');
      }
    }

    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    document.getElementById('logoutBtn').addEventListener('click', handleLogout);
    document.getElementById('refreshBtn').addEventListener('click', async () => {
      state.devices = [];
      state.tenants = [];
      await loadDashboardData();
    });
    document.getElementById('passwordForm').addEventListener('submit', handlePasswordUpdate);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && loginScreen.classList.contains('active')) {
        handleLogin();
      }
    });
  </script>
</body>
