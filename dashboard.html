<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReMan Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="page-header">
    <div class="container">
      <h1 class="page-title">🏠 ReMan</h1>
      <div class="profile-menu">
        <button id="profileButton" class="profile-button" type="button">Admin ▾</button>
        <div id="profileDropdown" class="profile-dropdown">
          <button type="button" onclick="viewProfile()">Profile</button>
          <button type="button" onclick="updatePasswordForm()">Update password</button>
          <button type="button" class="danger" onclick="confirmLogout()">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="app"></div>
  </main>

  <footer class="container">© 2026 Smart Home & Rental Management</footer>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loader" aria-hidden="true"></div>
  </div>

  <script src="app.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
